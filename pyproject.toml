[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcaer-reference"
version = "0.1.0"
description = "Auditable risk-conditioned execution routing for vision-guided robotic grasping (reference implementation)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "RCAER contributors"}]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]
keywords = ["robotics", "grasping", "risk-aware control", "industrial robotics", "auditability"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.8"]

[project.scripts]
rcaer = "rcaer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
